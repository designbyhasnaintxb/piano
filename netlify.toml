# Netlify: build the site from source.
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  # DRAFT PREVIEW ONLY. Content facts are still empty (see docs/CONTENT-AUDIT.md),
  # and the build refuses to run without this flag. Remove it before launch so an
  # unfinished site can never go live by accident.
  ALLOW_PLACEHOLDERS = "1"
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD = "1"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
